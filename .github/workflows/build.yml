name: Todo App Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/example  
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            targets: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop  # Using your develop branch
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29'  # Updated to 3.29 as specified
      
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Flutter pub get
        run: flutter pub get

      # Android Build
      - name: Build Android APK
        if: contains(matrix.targets, 'android')
        run: flutter build apk --release --target-platform android-arm
      
    
      
      # Upload artifacts for workflow use
      - name: Upload Android Build
        if: contains(matrix.targets, 'android')
        uses: actions/upload-artifact@v4
        with:
          name: todo-app-android-build
          path: |
            packages/example/build/app/outputs/flutter-apk/app-release.apk
            
     
